on:
  push:
    paths:
      - 'dialob-docusaurus/**'
    branches:
      - dev
      - main

  workflow_dispatch:

name: Docusaurus - Build - Documentation

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dialob-docusaurus
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: dialob-docusaurus/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: docusaurus-build
          path: dialob-docusaurus/build
